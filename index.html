<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的灵感导航站 ✨</title>
    <style>
        /* --- 基础样式定义 --- */
        :root {
            --bg-overlay-color: rgba(253, 246, 240, 0.8);
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary-color: #ffb7b2;
            --text-main: #5d5d5d;
            --text-sub: #888;
            --shadow: 0 8px 20px rgba(0,0,0,0.1);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fdf6f0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        #bg-video {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2; display: none;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-overlay-color);
            z-index: -1;
            transition: background 0.3s ease;
        }

        .container {
            max-width: 900px;
            width: 90%;
            padding: 40px 20px;
            text-align: center;
            z-index: 1;
        }

        header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            color: #ff8c94;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
        }

        /* --- 汉堡菜单修复 --- */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1002; /* 最高层级 */
            background: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px; /* 控制横杠间距 */
        }
        .menu-btn:hover { transform: scale(1.1); }
        .menu-btn span {
            display: block;
            width: 24px;
            height: 3px;
            background: var(--primary-color);
            border-radius: 10px;
        }

        /* --- 侧边菜单 --- */
        .nav-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 80px 25px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.05);
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1001;
            border-radius: 0 20px 20px 0;
            overflow-y: auto;
        }
        .nav-menu.active { transform: translateX(0); }
        .nav-menu ul { list-style: none; }
        .nav-menu li { margin: 15px 0; }
        .nav-menu a {
            text-decoration: none; color: var(--text-main);
            font-size: 1rem; transition: var(--transition);
            display: flex; align-items: center; gap: 8px;
        }
        .nav-menu a:hover { color: var(--primary-color); transform: translateX(5px); }

        /* --- 简洁模式 & 配置面板 --- */
        .menu-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .menu-section h4 { font-size: 0.9rem; color: #ff8c94; margin-bottom: 10px; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { font-size: 0.75rem; color: #999; display: block; margin-bottom: 4px; }
        .input-group input {
            width: 100%; padding: 8px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 0.85rem;
        }
        .apply-btn {
            width: 100%; padding: 10px; background: var(--primary-color);
            border: none; border-radius: 8px; color: white; cursor: pointer;
            font-weight: bold;
        }

        /* --- 音乐播放器 --- */
        .music-player {
            margin-top: 20px; padding: 15px; background: #f9f9f9;
            border-radius: 15px; text-align: center;
        }
        .music-info { font-size: 0.7rem; color: #999; margin-bottom: 5px; overflow: hidden; text-overflow:
ellipsis; white-space: nowrap; }
        .music-controls { display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* --- 搜索框修复 --- */
        .search-box {
            position: relative; /* 必须是相对定位 */
            max-width: 500px;
            margin: 20px auto;
            width: 100%;
        }
        .search-input {
            width: 100%;
            padding: 15px 120px 15px 20px; /* 右侧留出空间给下拉框 */
            border-radius: 30px;
            border: 2px solid #ffb7b2;
            outline: none;
            font-size: 1rem;
            background: white;
            box-shadow: var(--shadow);
        }
        .search-engine-select {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            padding: 6px 12px;
            border-radius: 15px;
            border: 1px solid #ddd;
            background: #fcfcfc;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
        }

        /* --- 网格布局 --- */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }
        .nav-card {
            background: var(--card-bg);
            border-radius: 24px; padding: 30px 20px;
            text-decoration: none; color: inherit;
            box-shadow: var(--shadow);
            transition: var(--transition);
            animation: fadeIn 0.6s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .nav-card:hover { transform: translateY(-8px) rotate(2deg); border: 2px solid var(--primary-color); }
        .card-icon { font-size: 40px; margin-bottom: 15px; }
        .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; }
        .card-desc { font-size: 0.85rem; color: var(--text-sub); }

        /* --- 透明度控制 --- */
        .opacity-ctrl-btn {
            position: fixed; bottom: 20px; right: 20px;
            width: 55px; height: 55px; background: white;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 1.8rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            cursor: pointer; z-index: 1000; border: 2px solid var(--primary-color);
        }
        .slider-container {
            position: fixed; bottom: 90px; right: 20px;
            background: white; padding: 20px; border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: none; flex-direction: column; align-items: center;
            gap: 12px; z-index: 1000;
        }
        .slider-container.show { display: flex; }

        .hidden-grid { display: none !important; }

        @media (max-width: 768px) {
            .nav-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .nav-menu { width: 85%; }
        }
        @media (max-width: 480px) {
            .nav-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body id="bg-body">

    <video id="bg-video" autoplay muted loop playsinline></video>
    <div class="overlay" id="overlay"></div>

    <button class="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="nav-menu" id="navMenu">
        <h3 style="color: #ff8c94; margin-bottom: 20px;">✨ 导航菜单</h3>
        <ul id="quickLinks">
            <li><a href="https://github.com" target="_blank"><span>💻</span> Github</a></li>
            <li><a href="https://bilibili.com" target="_blank"><span>📺</span> Bilibili</a></li>
            <li><a href="https://zhihu.com" target="_blank"><span>📚</span> 知乎</a></li>
            <li><a href="https://notion.so" target="_blank"><span>📝</span> Notion</a></li>
            <li><a href="https://pinterest.com" target="_blank"><span>🎨</span> Pinterest</a></li>
        </ul>

        <div class="menu-section">
            <h4>💡 功能设置</h4>
            <div class="input-group">
                <label>简洁模式 (隐藏卡片)</label>
                <button class="apply-btn" style="background: #eee; color: #333; font-size: 0.8rem;"
onclick="toggleSimpleMode()">
                    <span id="simpleModeText">开启简洁模式</span>
                </button>
            </div>

            <div class="menu-section" id="bgConfig">
                <h4>🎨 自定义背景</h4>
                <div class="input-group">
                    <label>选择图片或视频文件</label>
                    <input type="file" id="bgFileInput" accept="image/*,video/*">
                </div>
                <div class="input-group">
                    <label>背景底色</label>
                    <input type="color" id="bgColorPicker" value="#fdf6f0" style="height: 30px; padding: 2px;">
                </div>
                <button class="apply-btn" onclick="applyFileBackground()">应用背景</button>
            </div>

            <div class="music-player">
                <div class="music-info" id="musicName">暂无音乐</div>
                <div class="music-controls">
                    <input type="file" id="musicFile" accept="audio/*" style="display:none"
onchange="loadMusic(this)">
                    <button onclick="document.getElementById('musicFile').click()" style="font-size: 0.8rem;
cursor:pointer;">🎵 选择音乐</button>
                    <button id="playBtn" onclick="togglePlay()" style="font-size: 1.2rem; cursor:pointer;
border:none; background:none;">▶️</button>
                </div>
                <audio id="audioPlayer"></audio>
            </div>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1 id="title">My Links 🎀</h1>
            <p>寻找灵感，发现美好</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" class="search-input"
                   placeholder="输入关键词并按回车..." onkeydown="handleSearch(event)">
            <select id="engineSelect" class="search-engine-select">
                <option value="bing">Bing</option>
                <option value="google">Google</option>
            </select>
        </div>

        <main class="nav-grid" id="mainGrid">
            <a href="https://github.com" target="_blank" class="nav-card">
                <div class="card-icon">💻</div>
                <div class="card-title">GitHub</div>
                <div class="card-desc">代码托管平台</div>
            </a>
            <a href="https://bilibili.com" target="_blank" class="nav-card">
                <div class="card-icon">📺</div>
                <div class="card-title">Bilibili</div>
                <div class="card-desc">有趣的视频内容</div>
            </a>
            <a href="https://zhihu.com" target="_blank" class="nav-card">
                <div class="card-icon">📚</div>
                <div class="card-title">知乎</div>
                <div class="card-desc">深度知识分享</div>
            </a>
            <a href="https://notion.so" target="_blank" class="nav-card">
                <div class="card-icon">📝</div>
                <div class="card-title">Notion</div>
                <div class="card-desc">高效笔记神器</div>
            </a>
            <a href="https://pinterest.com" target="_blank" class="nav-card">
                <div class="card-icon">🎨</div>
                <div class="card-title">Pinterest</div>
                <div class="card-desc">视觉灵感收藏</div>
            </a>
            <a href="https://youtube.com" target="_blank" class="nav-card">
                <div class="card-icon">🎥</div>
                <div class="card-title">YouTube</div>
                <div class="card-desc">全球视听盛宴</div>
            </a>
        </main>

        <footer style="margin-top: 60px; color: #888;">
            <p>Made with ❤️ | 灵感导航站</p>
        </footer>
    </div>

    <div class="opacity-ctrl-btn" onclick="toggleSlider()">☀️</div>
    <div class="slider-container" id="sliderContainer">
        <label style="font-size: 0.8rem; color: #666;">背景亮度</label>
        <input type="range" id="opacitySlider" min="0" max="0.9" step="0.05" value="0.8">
    </div>

    <script>
        /** 1. 随机背景逻辑 **/
        const folderA = ['A/1.jpg', 'A/2.jpg', 'A/3.jpg', 'A/photo_01.png', 'A/skyline.jpg'];
        const folderB = ['B/1.jpg', 'B/2.jpg', 'B/3.jpg'];

        function setRandomBackground() {
            const savedBg = localStorage.getItem('customBgUrl');
            const savedColor = localStorage.getItem('customBgColor');

            if (savedBg) {
                applyCustomBackgroundFromStorage(savedBg, savedColor);
            } else {
                const isMobile = window.innerWidth < 768;
                const sourceFolder = isMobile ? folderB : folderA;

                if (sourceFolder.length > 0) {
                    const randomIndex = Math.floor(Math.random() * sourceFolder.length);
                    const selectedImg = sourceFolder[randomIndex];
                    document.body.style.backgroundImage = `url('${selectedImg}')`;
                }
            }
        }

        window.onload = setRandomBackground;

        /** 2. 菜单与交互修复 **/
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }

        // 点击页面任何地方关闭菜单和滑块
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('navMenu');
            const slider = document.getElementById('sliderContainer');
            const btn = document.querySelector('.opacity-ctrl-btn');
            const menuBtn = document.querySelector('.menu-btn');

            // 如果点击的对象不是菜单、不是滑块按钮、也不是汉堡按钮本身，则关闭
            if (!menu.contains(e.target) && !slider.contains(e.target) && !btn.contains(e.target) &&
!menuBtn.contains(e.target)) {
                menu.classList.remove('active');
                slider.classList.remove('show');
            }
        });

        /** 3. 简洁模式 **/
        function toggleSimpleMode() {
            const grid = document.getElementById('mainGrid');
            const btnText = document.getElementById('simpleModeText');
            grid.classList.toggle('hidden-grid');
            btnText.innerText = grid.classList.contains('hidden-grid') ? "显示卡片" : "隐藏卡片";
        }

        /** 4. 搜索引擎 **/
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('searchInput').value.trim();
                const engine = document.getElementById('engineSelect').value;
                if (query !== "") {
                    let searchUrl = engine === "bing"
                        ? `https://www.bing.com/search?q=${encodeURIComponent(query)}`
                        : `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                    window.open(searchUrl, '_blank');
                }
            }
        }

        /** 5. 透明度调节 **/
        const sliderBtn = document.querySelector('.opacity-ctrl-btn');
        const sliderContainer = document.getElementById('sliderContainer');
        const slider = document.getElementById('opacitySlider');
        const overlay = document.getElementById('overlay');

        function toggleSlider() {
            sliderContainer.classList.toggle('show');
        }

        slider.oninput = function() {
            overlay.style.backgroundColor = `rgba(253, 246, 240, ${this.value})`;
        };

        /** 6. 本地文件背景处理 **/
        function applyFileBackground() {
            const fileInput = document.getElementById('bgFileInput');
            const color = document.getElementById('bgColorPicker').value;

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const url = URL.createObjectURL(file);
                localStorage.setItem('customBgUrl', url);
                localStorage.setItem('customBgColor', color);
                applyCustomBackgroundFromStorage(url, color);
            } else {
                alert("请先选择一个本地文件");
            }
        }

        function applyCustomBackgroundFromStorage(url, color) {
            const video = document.getElementById('bg-video');
            document.body.style.backgroundImage = 'none';
            document.body.style.backgroundColor = color;

            if (url.toLowerCase().endsWith('.mp4') || url.toLowerCase().endsWith('.webm') ||
url.toLowerCase().endsWith('.ogg')) {
                video.style.display = 'block';
                video.src = url;
                video.play().catch(() => console.log("视频准备就绪，等待用户交互播放"));
            } else {
                video.style.display = 'none';
                document.body.style.backgroundImage = `url('${url}')`;
            }
        }

        /** 7. 本地音乐播放器 **/
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const musicName = document.getElementById('musicName');

        function loadMusic(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const url = URL.createObjectURL(file);
                audio.src = url;
                musicName.innerText = file.name;
                audio.load();
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "⏸️";
            } else {
                audio.pause();
                playBtn.innerText = "▶️";
            }
        }
    </script>
</body>
</html>
